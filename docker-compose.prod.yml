services:
  backend:
    build: ./backend
    container_name: hacienda-backend
    ports:
      - "8001:8001"
    environment:
      - PORT=8001
      - NODE_ENV=production
      - DB_HOST=${DB_HOST}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - DB_SSL=true
      # Obligatorio: sin JWT_SECRET el backend no arranca (el compose se corta con un aviso si falta).
      - JWT_SECRET=${JWT_SECRET:?definir JWT_SECRET en el .env}
      # Integración con la tienda (docs/integracion-tienda/README.md). Sin secreto → 503.
      - INTEGRACION_TIENDA_MODO=${INTEGRACION_TIENDA_MODO:-apagado}
      - INTEGRACION_TIENDA_SECRETO=${INTEGRACION_TIENDA_SECRETO:-}
      # Lectura por foto (backend/src/lib/vision.js). Sin URL o sin token → «Lectura por foto no disponible».
      - KIWI_VISION_URL=${KIWI_VISION_URL:-}
      - KIWI_VISION_TOKEN=${KIWI_VISION_TOKEN:-}
    command: ["npm", "start"]
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
    container_name: hacienda-frontend
    ports:
      - "8000:8000"
    depends_on:
      - backend
    restart: always
